version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    # Correctness.
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - copyloopvar
    - errorlint
    - nilerr
    - noctx
    - rowserrcheck
    - sqlclosecheck
    # Style and clarity.
    - gocritic
    - gocyclo
    - gocognit
    - misspell
    - nakedret
    - nolintlint
    - prealloc
    - revive
    - unconvert
    - unparam
    - whitespace
    - usestdlibvars
    # Security.
    - gosec
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*os.File).Close
    gocyclo:
      min-complexity: 20
    gocognit:
      min-complexity: 30
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        # Comments without leading space are common in C-mirrored
        # code.
        - commentFormatting
        # We carry deliberate var-name parity with CPython where it
        # helps readability of the port.
        - paramTypeCombine
    revive:
      rules:
        - name: var-naming
        - name: package-comments
        - name: exported
        - name: error-return
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
    misspell:
      locale: US
    gosec:
      excludes:
        # uint32 -> uint8 narrowing is intentional in pysync byte-flag
        # mutex words; sync/atomic has no Uint8.
        - G115
        # unsafe.Pointer is required for address-keyed parking and
        # the byte-flag mutex word identity.
        - G103
    nakedret:
      max-func-lines: 1
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - gocyclo
          - gocognit
          - unparam
          - revive
      # PyExc_* singletons keep CPython's exact spelling for source-shape
      # parity; the underscore is part of the public API contract.
      - path: errors/builtins\.go
        linters:
          - revive

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/tamnd/gopy

issues:
  max-same-issues: 0
  max-issues-per-linter: 0
