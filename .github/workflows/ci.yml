name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.x"

jobs:
  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Download modules
        run: go mod download
      - name: Run go vet
        run: go vet ./...
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  test:
    name: test (${{ matrix.os }} / go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build
        run: go build ./...
      - name: Run tests
        run: go test -race -count=1 ./...

  cfg-phase-parity:
    name: cfg-phase-parity (linux)
    runs-on: ubuntu-latest
    # Spec 1716 B.3 L2 gate. Builds a patched CPython 3.14.5 with the
    # cfg-phase-dump hook, caches the resulting tree by patch hash, and
    # runs test/gate/TestCfgPhaseParity against it. The test self-skips
    # when GOPY_PATCHED_CPYTHON is unset, so this job is the only place
    # the L2 diff actually fires.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libffi-dev libssl-dev zlib1g-dev
      - name: Cache patched CPython
        id: cpy-cache
        uses: actions/cache@v6
        with:
          path: ~/cpython-patched
          key: cpy-patched-3.14.5-${{ hashFiles('test/cpython/patches/0001-cfg-phase-dump.patch') }}
      - name: Build patched CPython
        if: steps.cpy-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p $HOME/src
          cd $HOME/src
          git clone --depth 1 --branch v3.14.5 https://github.com/python/cpython.git
          cd cpython
          git apply $GITHUB_WORKSPACE/test/cpython/patches/0001-cfg-phase-dump.patch
          ./configure --prefix=$HOME/cpython-patched --with-pydebug --disable-test-modules
          make -j"$(nproc)"
          # Stash the build tree (we need the in-place python.exe, not an
          # `make install` target, because _testinternalcapi only loads
          # against the in-tree build).
          mkdir -p $HOME/cpython-patched
          cp -r $HOME/src/cpython $HOME/cpython-patched/cpython
      - name: Run cfg phase parity gate
        run: |
          export GOPY_PATCHED_CPYTHON="$HOME/cpython-patched/cpython/python"
          test -x "$GOPY_PATCHED_CPYTHON"
          go test -count=1 ./test/gate -run TestCfgPhaseParity -v
